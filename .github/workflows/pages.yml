name: Deploy RNN demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate JavaScript syntax
        run: |
          node --check airline_rnn/web/app.js
          node --check airline_rnn/web/browser-engine.mjs
          node --check airline_rnn/web/browser-worker.mjs
          node --check airline_rnn/web/browser-transport.mjs
      - name: Build verified static assets
        run: python3 scripts/build_static_site.py
      - name: Verify RNN prediction parity
        run: |
          python3 scripts/build_browser_fixtures.py
          node scripts/verify_browser_model.mjs .build/browser/verification-input.json
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
